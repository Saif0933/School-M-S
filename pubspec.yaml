name: school_m_system
description: "Symbosys SMS — Enterprise School Management System"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter

  # State Management
  flutter_riverpod: ^2.6.1
  riverpod_annotation: ^2.6.1

  # Navigation
  go_router: ^14.8.1

  # UI & Design
  google_fonts: ^6.2.1
  flutter_svg: ^2.0.17
  shimmer: ^3.0.0
  animate_do: ^3.3.4
  flutter_staggered_animations: ^1.1.1
  cached_network_image: ^3.4.1
  flutter_animate: ^4.5.2

  # Charts & Data Visualization
  fl_chart: ^0.70.2
  syncfusion_flutter_charts: ^28.1.33
  percent_indicator: ^4.2.3

  # Forms & Input
  intl: ^0.20.2
  image_picker: ^1.1.2
  file_picker: ^8.1.7

  # Storage & Data
  shared_preferences: ^2.5.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  uuid: ^4.5.1
  dio: ^5.7.0

  # Utilities
  equatable: ^2.0.7
  dartz: ^0.10.1
  url_launcher: ^6.3.1
  package_info_plus: ^8.1.3
  connectivity_plus: ^6.1.3
  path_provider: ^2.1.5
  flutter_screenutil: ^5.9.3

  # Icons
  cupertino_icons: ^1.0.8
  iconsax: ^0.0.8
  phosphor_flutter: ^2.1.0

  # PDF & Printing
  pdf: ^3.11.2
  printing: ^5.13.5

  # Notifications
  flutter_local_notifications: ^18.0.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/icons/
    - assets/animations/
